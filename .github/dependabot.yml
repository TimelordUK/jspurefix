version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Keep routine dev-toolchain churn to a single PR rather than one per package.
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
    ignore:
      # TypeScript 7 is the native port and does not expose the JavaScript compiler
      # API ts-jest needs - ts-jest peers on ">=4.3 <7". Revisit when it ships TS 7
      # support. See #171.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # eslint-config-love still peers on eslint ^9. Lift together with it, not alone.
      - dependency-name: eslint
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
